# pnpm settings (moved here from package.json#pnpm — pnpm 11 no longer reads
# that field). This is NOT a multi-package workspace; pnpm-workspace.yaml is
# simply where pnpm >= 11 keeps its settings, single-package repos included.

# pnpm 11 renamed onlyBuiltDependencies to an allowBuilds map. Only biome's
# postinstall runs (same as the old onlyBuiltDependencies allowlist); the
# explicit `false` entries were implicitly denied under pnpm 10 and the tree
# works without their build scripts.
allowBuilds:
  "@biomejs/biome": true
  "@parity/product-sdk-terminal": false
  # bulletin-deploy (the renamed @parity/polkadot-app-deploy) ships a postinstall
  # (`patch-package || true`) bundling an @novasamatech/sdk-statement@0.6.0 patch.
  # We deny it: our own pnpm patch on that exact package (see patchedDependencies
  # below) already applies the fix, so the postinstall is redundant. Keep at false.
  "bulletin-deploy": true
  esbuild: false
  node-datachannel: false

minimumReleaseAgeExclude:
  # 0.18.4: taken to follow the DotNS ABI generations (0.15.0 only knew the
  # generation that still had PopRules.startingPrice(), so every deploy reverted
  # — see the generations note in CLAUDE.md). Validated by diffing the published
  # 0.15.0 and 0.18.4 tarballs: index exports are additive only, every
  # DeployOptions field we pass still exists, and the deploy banner strings the
  # progress parser matches are unchanged; then confirmed live — a deploy that
  # previously reverted at startingPrice now completes storage + DotNS.
  # Drop once it ages past the min-age window.
  - "bulletin-deploy@0.20.0"
  - "@parity/dotns-cli@0.8.0"
  # The @novasamatech/* 0.10.0 family (pulled transitively by
  # @parity/product-sdk-terminal@^0.10.0 → host-papp 0.10.0, pinned EXACT)
  # publishes the stable tag the same day; the min-age gate would
  # otherwise pin us to the older prerelease line. We opt these onto the stable
  # line explicitly — they come from the vetted triangle-js-sdks source.
  # host-papp pins statement-store exact, so the whole family must move together.
  # Drop these once the version naturally ages past the min-age window.
  - "@novasamatech/host-papp@0.10.0"
  - "@novasamatech/host-api@0.10.0"
  - "@novasamatech/host-api-wrapper@0.10.0"
  - "@novasamatech/statement-store@0.10.0"
  - "@novasamatech/storage-adapter@0.10.0"
  - "@novasamatech/scale@0.10.0"
  - "@novasamatech/substrate-slot-sr25519-wasm@0.10.0"
  - '@parity/product-sdk-descriptors@0.9.0'
  - '@parity/product-sdk-utils@0.2.0'

  # TEMPORARY (papi-3 PR #592) — revert before merge. pnpm 11.5.2's
  # lockfile check ignores VERSIONED excludes (it rejected the
  # '@parity/cdm-builder@6.0.0' form it had written itself) but honors
  # NAME-ONLY ones, so these entries are name-only to let CI install packages
  # published within the last day. Name-only exempts every future version
  # from the age gate: drop this block (the versions will have aged) together
  # with the bulletin-deploy re-pin.
  - '@parity/cdm-builder'
  - '@parity/cdm-codegen'
  - '@parity/cdm-env'
  - '@parity/cdm-utils'
  - '@parity/product-sdk-chain-client'
  - '@parity/product-sdk-cloud-storage'
  - '@parity/product-sdk-contracts'
  - '@parity/product-sdk-host'
  - '@parity/product-sdk-keys'
  - '@parity/product-sdk-local-storage'
  - '@parity/product-sdk-signer'
  - '@parity/product-sdk-terminal'
  - '@parity/product-sdk-tx'

overrides:
  # dotns-cli ships a broken publish manifest (file:.papi/descriptors missing
  # from the tarball) through every published 0.6.x AND 0.7.2; the version-
  # agnostic `>` prefix keeps this stub applied across bumps. See CLAUDE.md.
  "@parity/dotns-cli>@polkadot-api/descriptors": "file:./stubs/papi-descriptors-stub"
  # Load-bearing: collapses three transitive json-rpc-provider versions onto
  # one to avoid wire-shape divergence. See CLAUDE.md.
  "@polkadot-api/json-rpc-provider": "^0.2.0"
  # Security: force axios >= 1.16.0 to clear a batch of Dependabot advisories
  # (ReDoS, proxy-auth leaks, prototype-pollution gadgets). axios is transitive
  # only through @parity/dotns-cli, which ships a fully bundled dist/cli.js
  # (inlined deps, never resolved at runtime), so this is lockfile hygiene; the
  # advisories are browser/proxy paths that don't apply to the Node CLI anyway.
  # Drop once dotns-cli's own tree carries >= 1.16.0.
  "axios": "^1.16.0"

patchedDependencies:
  # PATCH(playground-cli) — local-only fixes pending upstream. See CLAUDE.md
  # "Two local pnpm patches remain" for what each one does.
  "@novasamatech/statement-store@0.12.0": "patches/@novasamatech__statement-store@0.12.0.patch"
  "@novasamatech/sdk-statement@0.6.0": "patches/@novasamatech__sdk-statement@0.6.0.patch"
